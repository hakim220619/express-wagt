<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp QR Code</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <style>
        html,
        body {
            height: 100%;
            /* Full height for html and body */
            margin: 0;
            /* Remove default margin */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            /* Light background for better contrast */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Center horizontally */
            text-align: center;
            /* Center text inside the container */
            width: 100%;
            /* Full width */
            max-width: 600px;
            /* Optional: limit the width for better aesthetics */
        }

        #loading-spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .full-width-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
        }

        img {
            max-width: 100%;
            /* Ensure the QR code is responsive */
            height: auto;
            /* Maintain aspect ratio */
        }

        .modal-content {
            margin: 0;
        }

        .modal-dialog {
            max-width: 600px;
            width: 100%;
        }

        #message-form {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <div class="row">
            <div class="col-md-12">
                <button id="generate-qr-btn" class="btn btn-primary full-width-btn" data-toggle="modal"
                    data-target="#input-modal">
                    Generate QR Code
                </button>
            </div>
            <div class="col-md-12">
                <div id="loading-spinner" class="mt-3" style="display: none;"></div>
                <div class="text-center mt-3">
                    <img id="qr-code" src="" alt="QR Code will be displayed here" class="img-fluid"
                        style="display: none;" />
                </div>
                <p id="sessionId" class="font-weight-bold mt-2 text-center"></p>
            </div>

            <!-- Input Modal -->
            <div id="input-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="inputModalLabel"
                aria-hidden="true">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="inputModalLabel">Input Required</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label for="sessionName">Enter your input:</label>
                                <input type="text" id="sessionName" class="form-control"
                                    placeholder="Enter a name or description" />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                            <button type="button" id="confirm-input-btn" class="btn btn-primary">Generate QR
                                Code</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="message-form" class="mt-4" style="display: none;">
                <h2>Send WhatsApp Message</h2>
                <div class="form-group">
                    <label for="number">Phone Number (International format without +):</label>
                    <input type="text" id="number" placeholder="e.g. 6281234567890" class="form-control" />
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" placeholder="Type your message here" class="form-control"></textarea>
                </div>
                <button id="send-message-btn" class="btn btn-success full-width-btn">
                    Send Message
                </button>
            </div>

            <div class="col-md-12">
                <div class="text-center mt-4">
                    <button id="show-sessions-btn" class="btn btn-info full-width-btn">
                        Show Active Sessions
                    </button>
                </div>

                <!-- Modal for Active Sessions -->

            </div>
        </div>
        <div id="session-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="sessionModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl" role="document" style="max-width: 80%; width: auto;">
                <div class="modal-content" style="padding: 20px;">
                    <div class="modal-header">
                        <h5 class="modal-title" id="sessionModalLabel">Active Sessions</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="table-responsive">
                            <table id="session-table" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Session ID</th>
                                        <th>Name</th>
                                        <th>Number</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>

                        <div class="table-responsive" style="margin-top: 20px">
                            <table id="group-table" class="table table-striped" style="display: none;">
                                <thead>
                                    <tr>
                                        <th>Group ID</th>
                                        <th>Group Name</th>
                                        <th>Participants</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="send-message-modal" class="modal fade" tabindex="-1" role="dialog"
            aria-labelledby="sendMessageModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="sendMessageModalLabel">Send WhatsApp Message</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="number">Phone Number (International format without +):</label>
                            <input type="text" id="numberasd" value="6285797887711" placeholder="e.g. 6281234567890"
                                class="form-control" />
                        </div>
                        <div class="form-group">
                            <label for="message">Message:</label>
                            <textarea id="messageasd" placeholder="Type your message here"
                                class="form-control"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="file">Attach File:</label>
                            <input type="file" id="file" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Optional Buttons:</label>
                            <div id="buttons-container">
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" placeholder="Button Text"
                                        aria-label="Button Text" id="buttonText1">
                                    <input type="text" class="form-control" placeholder="Button ID"
                                        aria-label="Button ID" id="buttonId1">
                                    <div class="input-group-append">
                                        <button class="btn btn-danger" type="button"
                                            onclick="removeButton(this)">Remove</button>
                                    </div>
                                </div>
                                <!-- Additional buttons can be dynamically added here -->
                            </div>
                            <button class="btn btn-primary" type="button" onclick="addButton()">Add Button</button>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button id="send-message-btn" class="btn btn-success" onclick="sendMessage()">Send
                            Message</button>
                    </div>
                </div>
            </div>
        </div>



        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let currentSessionId = null;
            let sessionPollInterval = null;

            const LS_LAST_SESSION_ID = "lastSessionId";
            const LS_REFRESHED_FOR_SESSION = "refreshedForSessionId";

            function setStatusText(text) {
                const sessionIdText = document.getElementById("sessionId");
                if (sessionIdText) sessionIdText.textContent = text;
            }

            function stopPolling() {
                if (sessionPollInterval) {
                    clearInterval(sessionPollInterval);
                    sessionPollInterval = null;
                }
            }

            async function pollSessionUntilReady(sessionId, { autoRefreshOnce = true } = {}) {
                stopPolling();

                const qrImage = document.getElementById("qr-code");
                const messageForm = document.getElementById("message-form");

                async function checkOnce() {
                    try {
                        // Prefer session-status (more detailed), fallback to check-session
                        let statusResp = null;
                        try {
                            statusResp = await axios.get(`/session-status/${encodeURIComponent(sessionId)}`);
                        } catch (e) {
                            // ignore and fallback
                        }

                        const s = statusResp?.data?.sessionStatus;
                        if (s?.status) {
                            if (s.status === "ready") {
                                stopPolling();
                                setStatusText(`Session ID: ${sessionId} (CONNECTED)`);
                                if (qrImage) qrImage.style.display = "none";
                                if (messageForm) messageForm.style.display = "block";

                                const refreshedFor = localStorage.getItem(LS_REFRESHED_FOR_SESSION);
                                if (autoRefreshOnce && refreshedFor !== sessionId) {
                                    localStorage.setItem(LS_REFRESHED_FOR_SESSION, sessionId);
                                    // small delay so UI updates are visible
                                    setTimeout(() => window.location.reload(), 800);
                                }
                                return;
                            }

                            if (s.status === "qr" && s.qr && qrImage && qrImage.style.display !== "block") {
                                qrImage.src = s.qr;
                                qrImage.style.display = "block";
                            }

                            setStatusText(`Session ID: ${sessionId} (${s.status})`);
                            return;
                        }

                        // Fallback: basic check endpoint
                        const readyResp = await axios.get(`/check-session/${encodeURIComponent(sessionId)}`);
                        if (readyResp.data?.status) {
                            stopPolling();
                            setStatusText(`Session ID: ${sessionId} (CONNECTED)`);
                            if (qrImage) qrImage.style.display = "none";
                            if (messageForm) messageForm.style.display = "block";
                        }
                    } catch (err) {
                        // Not ready yet / still initializing. Keep polling silently.
                    }
                }

                await checkOnce();
                sessionPollInterval = setInterval(checkOnce, 3000);
            }

            function openSendMessageModal(sessionId) {
                currentSessionId = sessionId; // Set currentSessionId to the selected sessionId
                document.getElementById("numberasd").value = "6285797887711"; // Clear previous input
                document.getElementById("messageasd").value = "asdasd"; // Clear previous input
                document.getElementById("file").value = ""; // Clear previous file input
                $('#send-message-modal').modal('show'); // Show the send message modal

                // Set focus on the number input
                document.getElementById("numberasd").focus();
            }


            function sendMessage() {
                const number = document.getElementById('numberasd').value;
                const message = document.getElementById('messageasd').value;
                const fileInput = document.getElementById('file');
                const buttons = [];

                // Gather button information
                const buttonTexts = document.querySelectorAll('input[id^="buttonText"]');
                const buttonIds = document.querySelectorAll('input[id^="buttonId"]');

                buttonTexts.forEach((textInput, index) => {
                    const text = textInput.value.trim();
                    const id = buttonIds[index].value.trim();
                    if (text && id) { // Only include buttons that have both text and id
                        buttons.push({ text, id });
                    }
                });

                const formData = new FormData();
                formData.append('sessionId', currentSessionId); // Replace with actual session ID
                formData.append('number', number);
                formData.append('message', message);

                if (fileInput.files.length > 0) {
                    formData.append('file', fileInput.files[0]);
                }

                if (buttons.length > 0) {
                    formData.append('buttons', JSON.stringify(buttons)); // Correctly add buttons to the form data
                }
                // Send the message using fetch
                fetch('/send-message', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        if (data.status) {
                            alert("Message sent successfully!");
                        } else {
                            alert("Error: " + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert("An error occurred while sending the message.");
                    });
            }

            function addButton() {
                const buttonsContainer = document.getElementById('buttons-container');
                const index = buttonsContainer.children.length + 1; // Get current number of buttons
                const buttonGroup = document.createElement('div');
                buttonGroup.className = 'input-group mb-2';
                buttonGroup.innerHTML = `
                    <input type="text" class="form-control" placeholder="Button Text" aria-label="Button Text" id="buttonText${index}">
                    <input type="text" class="form-control" placeholder="Button ID" aria-label="Button ID" id="buttonId${index}">
                    <div class="input-group-append">
                        <button class="btn btn-danger" type="button" onclick="removeButton(this)">Remove</button>
                    </div>
                `;
                buttonsContainer.appendChild(buttonGroup);
            }

            function removeButton(button) {
                const buttonGroup = button.closest('.input-group');
                buttonGroup.remove();
            }




            document
                .getElementById("confirm-input-btn")
                .addEventListener("click", async function () {
                    const sessionName = document.getElementById("sessionName").value;
                    if (!sessionName) {
                        alert("Input cannot be empty");
                        return;
                    }

                    // Close the modal
                    $('#input-modal').modal('hide');

                    const generateButton = document.getElementById("generate-qr-btn");
                    const loadingSpinner = document.getElementById("loading-spinner");
                    const qrImage = document.getElementById("qr-code");
                    const sessionIdText = document.getElementById("sessionId");

                    // Disable button and show loader
                    generateButton.disabled = true;
                    loadingSpinner.style.display = "block";

                    try {
                        const response = await axios.post("/start-session", { sessionName: sessionName });

                        if (response.data.qr) {
                            qrImage.src = response.data.qr;
                            qrImage.style.display = "block";

                            currentSessionId = response.data.sessionId;
                            localStorage.setItem(LS_LAST_SESSION_ID, currentSessionId);
                            localStorage.removeItem(LS_REFRESHED_FOR_SESSION);
                            sessionIdText.textContent = `Session ID: ${currentSessionId} (qr)`;

                            // Auto check until connected, then refresh once
                            pollSessionUntilReady(currentSessionId, { autoRefreshOnce: true });

                            // Hide QR Code after 10 seconds
                        } else {
                            alert("Failed to generate QR Code");
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        alert("Error generating QR Code");
                    } finally {
                        // Re-enable button and hide loader
                        generateButton.disabled = false;
                        loadingSpinner.style.display = "none";
                    }


                });

            // Check session status every 5 seconds=



            async function fetchSessions() {
                try {
                    const response = await axios.get("/list-sessions");
                    const sessionTable = document.getElementById("session-table");
                    const tableBody = sessionTable.querySelector("tbody");
                    tableBody.innerHTML = "";
                    const { sessions = [], authFiles = [] } = response.data;

                    const combinedSessions = authFiles.map((auth) => {
                        const matchingSession = sessions.find(
                            (session) => session.sessionId === auth
                        );
                        return {
                            sessionId: auth,
                            name: matchingSession?.name || "N/A",
                            number: matchingSession?.number || "N/A",
                            status: matchingSession?.status || "disconnected",
                        };
                    });

                    if (combinedSessions.length > 0) {
                        sessionTable.style.display = "table";

                        combinedSessions.forEach((session) => {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                    <td>${session.sessionId}</td>
                    <td>${session.name}</td>
                    <td>${session.number}</td>
                    <td>
    <button class="btn btn-secondary" onclick="fetchGroups('${session.sessionId}')">Lihat Grup</button>
    ${session.status !== "connected"
                                    ? `<button class="btn btn-warning" onclick="reconnectSession('${session.sessionId}', this)">Reconnect</button>
           <div class="spinner-border text-warning" id="spinner-${session.sessionId}" role="status" style="display: none;">
               <span class="sr-only">Loading...</span>
           </div>`
                                    : ""}
    
    <button class="btn btn-danger" onclick="deleteAuthFile('${session.sessionId}')">Delete Session</button>
    
    <!-- New Disconnect Button -->
    <button class="btn btn-danger" onclick="disconnectSession('${session.sessionId}')">Disconnect</button>

    <!-- New Send Message Button -->
    <button class="btn btn-primary" onclick="openSendMessageModal('${session.sessionId}')">Send Message</button>
</td>

                  `;
                            tableBody.appendChild(row);
                        });
                    } else {
                        sessionTable.style.display = "none";
                    }
                } catch (error) {
                    console.error("Error fetching sessions:", error);
                    alert("Gagal mengambil data sesi. Silakan coba lagi.");
                }
            }


            async function checkSession(sessionId) {
                try {
                    const response = await axios.get(`/check-session/${sessionId}`);
                    alert(`Status sesi: ${response.data.status}`);
                } catch (error) {
                    console.error(`Gagal memeriksa sesi ${sessionId}:`, error);
                    alert("Gagal memeriksa sesi. Silakan coba lagi.");
                }
            }

            async function deleteAuthFile(fileName) {
                try {
                    const response = await axios.delete(`/delete-auth-file/${fileName}`);
                    alert(response.data.message);
                    fetchSessions();
                } catch (error) {
                    console.error("Error deleting file:", error);
                    alert("Gagal menghapus file. Silakan coba lagi.");
                }
            }
            async function disconnectSession(sessionId) {
                try {
                    const response = await axios.post(`/disconnect-session`, { sessionId });

                    if (response.data.status) {
                        alert("Session disconnected successfully");
                        fetchSessions(); // Refresh the session list
                    } else {
                        alert("Failed to disconnect session: " + response.data.message);
                    }
                } catch (error) {
                    console.error("Error disconnecting session:", error);
                    alert("Error disconnecting session");
                }
            }

            async function fetchGroups(sessionId) {
                const groupTable = document.getElementById("group-table");
                const tableBody = groupTable.querySelector("tbody");
                tableBody.innerHTML = "";

                try {
                    const response = await axios.get(`/list-groups/${sessionId}`);

                    if (response.data.groups.length > 0) {
                        groupTable.style.display = "table";
                        response.data.groups.forEach((group) => {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                        <td>${group.id}</td>
                        <td>${group.name}</td>
                        <td>${group.participants}</td>
                    `;
                            tableBody.appendChild(row);
                        });
                    } else {
                        alert("No groups found for this session.");
                        groupTable.style.display = "none";
                    }
                } catch (error) {
                    console.error("Error fetching groups:", error);
                    alert("Failed to fetch groups.");
                    groupTable.style.display = "none";
                }
            }

            async function reconnectSession(sessionId, button) {
                const reconnectSpinner = document.getElementById(`spinner-${sessionId}`);

                button.disabled = true;
                button.style.display = "none";
                reconnectSpinner.style.display = "inline-block";

                try {
                    const response = await axios.post(`/reconnect-session`, { sessionId });
                    fetchSessions();
                    alert(response.data.message);

                    // Poll until we get QR / ready, then update UI
                    currentSessionId = sessionId;
                    localStorage.setItem(LS_LAST_SESSION_ID, currentSessionId);
                    pollSessionUntilReady(currentSessionId, { autoRefreshOnce: true });
                } catch (error) {
                    console.error(`Error reconnecting session ${sessionId}:`, error);
                    alert(`Gagal reconnect untuk session ${sessionId}.`);


                } finally {
                    button.disabled = false;
                    button.style.display = "inline-block";
                    reconnectSpinner.style.display = "none";


                }
            }

            function displayQRCode(sessionId, qrCode) {
                const sessionTable = document.getElementById("session-table");
                const rows = sessionTable.querySelectorAll("tbody tr");

                rows.forEach((row) => {
                    const sessionCell = row.querySelector("td:first-child");
                    if (sessionCell.textContent === sessionId) {
                        // Create a new cell for the QR code
                        const qrCell = document.createElement("td");
                        qrCell.colSpan = 4; // Make it span all columns
                        qrCell.innerHTML = `
                            <div style="text-align: center; margin-top: 20px;">
                                <p style="font-weight: bold;">QR Code for Session ${sessionId}:</p>
                                <img src="${qrCode}" alt="QR Code for ${sessionId}" style="max-width: 100%; height: auto; border: 2px solid #007bff; border-radius: 5px;"/>
                            </div>
                        `;

                        // Clear the current content of the row and append the QR cell
                        row.innerHTML = "";
                        row.appendChild(qrCell);
                    }
                });
            }
            document
                .getElementById("send-message-btn")
                .addEventListener("click", async function () {
                    const number = document.getElementById("number").value;
                    const message = document.getElementById("message").value;
                    console.log(number)
                    if (!number || !message) {
                        alert("Number and message cannot be empty");
                        return;
                    }

                    try {
                        const sendMessageResponse = await axios.post("/send-message", {
                            sessionId: currentSessionId,
                            number: number,
                            message: message,
                        });

                        if (sendMessageResponse.data.status) {
                            alert("Message sent successfully");
                        } else {
                            alert(
                                "Failed to send message: " + sendMessageResponse.data.message
                            );
                        }
                    } catch (error) {
                        console.error("Error sending message:", error);
                        alert("Error sending message");
                    }
                });


            const showModalBtn = document.getElementById("show-sessions-btn");
            const modal = $('#session-modal');

            showModalBtn.addEventListener("click", () => {
                modal.modal('show');
                fetchSessions();
            });

            window.addEventListener("click", (event) => {
                if (event.target === modal) {
                    modal.modal('hide');
                }
            });

            // On page load: if we have a last session id, auto-check status
            window.addEventListener("load", () => {
                const last = localStorage.getItem(LS_LAST_SESSION_ID);
                if (last) {
                    currentSessionId = last;
                    pollSessionUntilReady(last, { autoRefreshOnce: false });
                }
            });

        </script>
</body>

</html>
